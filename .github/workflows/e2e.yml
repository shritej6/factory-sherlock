# End-to-end browser tests.
#
# Starts MySQL 8.4 as a throwaway service container, migrates it and loads the
# demo scenario, then runs the Playwright suite in frontend/e2e. The Playwright
# config starts the FastAPI backend (port 8013) and the Vite dev server (port
# 5183) itself. The passwords below are fixed values for the disposable CI
# database and demo accounts only; they are never used anywhere else.
name: End-to-End

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  MYSQL_ROOT_PASSWORD: ci-root-password
  MYSQL_DATABASE: factory_sherlock
  MYSQL_USER: sherlock_app
  MYSQL_PASSWORD: ci-app-password
  SEED_DEMO_PASSWORD: ci-demo-password

jobs:
  e2e:
    name: Playwright against the seeded demo database
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          # Service definitions cannot read the workflow env context, so the root
          # password is repeated here. Keep it identical to env.MYSQL_ROOT_PASSWORD.
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          # Pinned so CI resolves the lockfile with the same uv as the
          # development machine (setup-uv "version" input, exact release).
          version: "0.10.4"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        # Only the dev group: the docs group pulls in the Python Playwright
        # package, which this job does not use (the browser tests run with
        # @playwright/test from frontend/package.json).
        working-directory: backend
        run: uv sync --locked --group dev

      - name: Ensure a MySQL client is available
        run: |
          if ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y mysql-client
          fi
          mysql --version

      - name: Create .env for CI from .env.example
        # APP_ENV stays "development" so the backend, the migrations, and the
        # seed command all use the main database rather than the _test one.
        run: |
          jwt_secret="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          cp .env.example .env
          sed -i "s|^MYSQL_HOST=.*|MYSQL_HOST=127.0.0.1|" .env
          sed -i "s|^MYSQL_PORT=.*|MYSQL_PORT=3306|" .env
          sed -i "s|^MYSQL_DATABASE=.*|MYSQL_DATABASE=${MYSQL_DATABASE}|" .env
          sed -i "s|^MYSQL_USER=.*|MYSQL_USER=${MYSQL_USER}|" .env
          sed -i "s|^MYSQL_PASSWORD=.*|MYSQL_PASSWORD=${MYSQL_PASSWORD}|" .env
          sed -i "s|^MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}|" .env
          sed -i "s|^JWT_SECRET_KEY=.*|JWT_SECRET_KEY=${jwt_secret}|" .env
          sed -i "s|^SEED_DEMO_PASSWORD=.*|SEED_DEMO_PASSWORD=${SEED_DEMO_PASSWORD}|" .env
          sed -i "s|^CORS_ORIGINS=.*|CORS_ORIGINS=http://localhost:5173,http://localhost:5183|" .env
          sed -i "s|^APP_ENV=.*|APP_ENV=development|" .env
          # Print the non-secret keys so the job log shows what the backend will read.
          grep -E '^(MYSQL_HOST|MYSQL_PORT|MYSQL_DATABASE|MYSQL_USER|CORS_ORIGINS|APP_ENV)=' .env

      - name: Create databases and application user
        env:
          MYSQL_ROOT_ARGS: "-uroot -p${{ env.MYSQL_ROOT_PASSWORD }} -h127.0.0.1 -P3306 --protocol=tcp"
        run: bash scripts/setup/init_databases.sh

      - name: Apply migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Seed reference data, demo accounts, and the demo scenario
        working-directory: backend
        run: uv run python -m app.seed --demo

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # No "version" input: pnpm/action-setup reads the pnpm version from
          # the "packageManager" field of frontend/package.json.
          package_json_file: frontend/package.json
          run_install: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Resolve pnpm store path
        id: pnpm-store
        working-directory: frontend
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install the Playwright Chromium build and its system libraries
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the end-to-end suite
        working-directory: frontend
        env:
          CI: "1"
          E2E_PASSWORD: ${{ env.SEED_DEMO_PASSWORD }}
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: warn
          retention-days: 14
