[project]
name = "factory-sherlock-backend"
version = "0.1.0"
description = "FastAPI backend for Factory Sherlock: manufacturing simulation, quality control, and investigation on MySQL."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "pymysql>=1.1.1",
  "cryptography>=43",
  "pydantic[email]>=2.10",
  "pydantic-settings>=2.7",
  "pyjwt>=2.10",
  "bcrypt>=4.2",
  "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-pymysql>=1.1",
]
docs = [
  "playwright>=1.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
# Autogenerated migration files keep Alembic's own formatting.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI dependency injection uses call defaults by design.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # fixture payloads read better on one line

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a running MySQL test database",
]
addopts = "-ra"
