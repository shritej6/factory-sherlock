# Optional MySQL service for developers who have Docker installed.
# Developers without Docker can use scripts/development/local_mysql.sh instead.
# The init script creates the application database, the test database, and the
# least-privilege application user from the values in .env. Compose reads the
# ${...} references below from .env by default; the whole file is deliberately
# not passed to the container.
#
# Docker is not installed on the development machine. This path is verified in
# GitHub Actions by the Compose Smoke workflow
# (.github/workflows/compose-smoke.yml), which runs on every change to this
# file, scripts/setup/, or .env.example.
services:
  mysql:
    image: mysql:8.4
    container_name: factory-sherlock-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # MYSQL_DATABASE and MYSQL_USER are intentionally not set: the official
      # image would create that user with GRANT ALL and defeat the
      # least-privilege grants in init_databases.sh, which reads APP_DB_*.
      APP_DB_NAME: ${MYSQL_DATABASE}
      APP_DB_USER: ${MYSQL_USER}
      APP_DB_PASSWORD: ${MYSQL_PASSWORD}
      # The init script runs inside the entrypoint, where the temporary server
      # listens only on the local socket.
      MYSQL_ROOT_ARGS: -uroot -p${MYSQL_ROOT_PASSWORD}
      MYSQL_CLIENT_ARGS: --socket=/var/run/mysqld/mysqld.sock
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/setup/init_databases.sh:/docker-entrypoint-initdb.d/01_init.sh:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO
    healthcheck:
      # TCP on 127.0.0.1 only answers once the entrypoint has finished the init
      # scripts and started the real server, so "healthy" means "initialised".
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
